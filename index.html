const N=s=>s.replace(/\s+/g,'').toUpperCase();
const Y=n=>(n!=null&&n!==0)?'¥'+Number(n).toLocaleString():'-';
const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};
const cst=(o,pl)=>{const pk=PC[pl].pk;return o?pk.reduce((s,k)=>s+(o[k]||0),0):0};

function gS(){return[...data].filter(d=>d.s||d.m||d.i||d.a).sort((a,b)=>N(b.n).length-N(a.n).length)}
function eG(t){const n=N(t);for(const g of gS()){if(n.includes(N(g.n)))return g.n}return null}
function eCS(t){const mm=[...t.matchAll(/【([^】]+)】/g)];return mm.length?mm[mm.length-1][1]:null}
function eCM(t){const m=t.match(/【ゲーミングPC】【([^】]+)】/);return m?m[1]:null}
function aL(msg){logs.unshift('['+new Date().toLocaleTimeString()+'] '+msg);if(logs.length>100)logs.length=100;rL()}
function dl(c,fn,ty){const b=new Blob([c],{type:ty});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=fn;a.click();URL.revokeObjectURL(u)}

// .ci change handler
let _ciTimer=null,_rendering=false;
function ciCommit(inp,andRender){
  if(_rendering)return;
  const ds=inp.dataset,i=+ds.i,pl=ds.pl,k=ds.k;
  const o=data[i]?data[i][pl]:null;if(!o)return;
  const nv=parseInt(inp.value)||0;
  if(o[k]===nv)return;
  o[k]=nv;
  if(k==='gpu'&&gpuSync){['s','m','i','a'].forEach(p2=>{if(p2===pl||!data[i][p2])return;if('gpu' in data[i][p2])data[i][p2].gpu=nv})}
  if(k!=='p'){
    const targets=(k==='gpu'&&gpuSync)?['s','m','i','a']:[pl];
    targets.forEach(p2=>{if(!data[i][p2]||!autoFlags[p2])return;
      const P2=PC[p2];const c2=P2.pk.reduce((s2,kk)=>s2+(data[i][p2][kk]||0),0);
      if(c2>0)data[i][p2].p=P2.autoP(c2);
    });
  }
  if(andRender){_rendering=true;rA();_rendering=false;}
}
// input: debounced save (no rerender - just update data)
document.addEventListener('input',e=>{const inp=e.target.closest('.ci');if(!inp)return;ciCommit(inp,false)});
// blur: full rerender
document.addEventListener('blur',e=>{const inp=e.target.closest('.ci');if(inp){ciCommit(inp,false);
  clearTimeout(_ciTimer);_ciTimer=setTimeout(()=>{_rendering=true;rA();_rendering=false},50)}},true);
// Enter=下の行, ↑↓=行移動
document.addEventListener('keydown',e=>{
  const inp=e.target.closest('.ci');if(!inp)return;
  const i=+inp.dataset.i,pl=inp.dataset.pl,k=inp.dataset.k;
  if(e.key==='Enter'||e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();ciCommit(inp,false);
    const ni2=e.key==='ArrowUp'?i-1:i+1;
    _rendering=true;rA();_rendering=false;
    setTimeout(()=>{const ni=document.querySelector('.ci[data-i="'+ni2+'"][data-pl="'+pl+'"][data-k="'+k+'"]');if(ni){ni.focus();ni.select()}},20);
  }
});
// focus時に全選択
document.addEventListener('focus',e=>{const inp=e.target.closest('.ci');if(inp)inp.select()},true);

// dblclick: text fields only (name, url, case names)
let editing=false;
document.addEventListener('dblclick',e=>{
  if(editing)return;
  const el=e.target.closest('.edt');if(!el)return;
  editing=true;
  const ds=el.dataset, i=+ds.i, pl=ds.pl, k=ds.k;
  let val;
  if(k==='n')val=data[i].n;
  else if(k==='kk')val=data[i].kk;
  else if(k==='cn'){val=(pl==='s'?sC:mC)[i].n}
  else if(k==='ca'){val=(pl==='s'?sC:mC)[i].a}
  const isNum=k==='ca';
  const inp=document.createElement('input');
  inp.className='inp'+(isNum?'':' wide');
  inp.type=isNum?'number':'text';
  inp.value=val!=null?val:'';
  el.replaceWith(inp);inp.focus();inp.select();
  const done=()=>{
    editing=false;let v=inp.value;
    if(k==='n'){data[i].n=v||''}
    else if(k==='kk'){data[i].kk=v||''}
    else if(k==='cn'){(pl==='s'?sC:mC)[i].n=v||''}
    else if(k==='ca'){(pl==='s'?sC:mC)[i].a=parseInt(v)||0}
    rA();
  };
  inp.addEventListener('blur',done);
  inp.addEventListener('keydown',ev=>{if(ev.key==='Enter'){inp.blur()}if(ev.key==='Escape'){editing=false;rA()}});
});

function anC(pl){
  const isS=pl==='s',csv=isS?shopCsv:mercCsv;if(!csv)return[];
  const cm=isS?Object.fromEntries(sC.map(c=>[c.n,c])):null;
  const mm=isS?null:{};if(!isS)mC.forEach(c=>{if(c.mn)mm[c.mn]=c});
  return csv.map((row,idx)=>{
    const t=isS?(row.Title||''):(row['商品名']||'');
    if(isS&&!t.trim())return null;
    const g=eG(t),c=isS?eCS(t):eCM(t);
    const d=g?data.find(x=>N(x.n)===N(g)):null;
    const o=d?(isS?d.s:d.m):null;
    const ca=isS?(c?cm[c]:null):(c?mm[c]:null);
    const np=(o&&o.p)?o.p+(ca?ca.a:0):null;
    const cp=parseInt(isS?row['Variant Price']:row['販売価格'])||0;
    let ex=false,stk=0;
    if(isS){ex=row.Status!=='active'}
    else{ex=row['商品ステータス']!=='2';for(let i=1;i<=10;i++){const v=row['SKU'+i+'_現在の在庫数'];if(v)stk+=parseInt(v)||0}if(!stk)ex=true}
    return{idx,t,g,c,st:isS?row.Status:null,stk,cp,np,d:np!=null?np-cp:null,ok:!!(o&&o.p),ex};
  }).filter(Boolean);
}

// CSV ops
// ============================================================
function iC(pl,el){
  const f=el.files[0];if(!f)return;
  if(pl==='s'){Papa.parse(f,{header:true,skipEmptyLines:false,complete:r=>{shopCsv=r.data;aL('Shopify CSV読込: '+r.data.filter(x=>x.Title&&x.Title.trim()).length+'商品');rV('s')}})}
  else{const rd=new FileReader();rd.onload=ev=>{let t;try{t=new TextDecoder('shift-jis').decode(ev.target.result)}catch{t=new TextDecoder('utf-8').decode(ev.target.result)}
    mercCsv=Papa.parse(t,{header:true,skipEmptyLines:true}).data;aL('メルカリCSV読込: '+mercCsv.length+'商品');rV('m')};rd.readAsArrayBuffer(f)}
  el.value='';
}
function aC(pl){
  const isS=pl==='s',csv=isS?shopCsv:mercCsv;if(!csv)return;
  let up=0,sk=0;
  const cm=Object.fromEntries(sC.map(c=>[c.n,c]));
  const mm={};mC.forEach(c=>{if(c.mn)mm[c.mn]=c});
  csv.forEach(row=>{
    const t=isS?(row.Title||''):(row['商品名']||'');if(isS&&!t.trim())return;
    const g=eG(t);if(!g){sk++;return}
    const d=data.find(x=>N(x.n)===N(g)),o=d?(isS?d.s:d.m):null;if(!o||!o.p){sk++;return}
    const c=isS?eCS(t):eCM(t),ca=isS?(c?cm[c]:null):(c?mm[c]:null);
    const np=o.p+(ca?ca.a:0),key=isS?'Variant Price':'販売価格';
    if(String(np)!==String(row[key]))up++;row[key]=String(np);
  });
  aL((isS?'Shopify':'メルカリ')+'価格適用: '+up+'件変更 / '+sk+'件スキップ');rV(pl);
}
function eC(pl){
  const isS=pl==='s',csv=isS?shopCsv:mercCsv;if(!csv)return;let f;
  if(isS){const ah=new Set();csv.forEach(r=>{if(r.Status==='active'&&r.Handle)ah.add(r.Handle)});
    f=csv.filter(r=>r.Status?r.Status==='active':r.Handle&&ah.has(r.Handle))}
  else{f=csv.filter(r=>{if(r['商品ステータス']!=='2')return false;let s=0;for(let i=1;i<=10;i++){const v=r['SKU'+i+'_現在の在庫数'];if(v)s+=parseInt(v)||0}return s>0})}
  dl('\uFEFF'+Papa.unparse(f),(isS?'shopify':'mercari')+'_updated.csv','text/csv;charset=utf-8');
  aL((isS?'Shopify':'メルカリ')+'CSV出力: '+f.length+'行');
}

// ============================================================
// Add/Del
// ============================================================
function addR(pl){const P=PC[pl];const o={p:0};P.pk.forEach(k=>o[k]=0);
  const d={n:'新規GPU',kk:'',s:null,m:null,i:null,a:null};d[pl]={...o};data.push(d);rA()}
function autoCalc(pl){
  const P=PC[pl];let cnt=0;
  data.forEach(d=>{
    const o=d[pl];if(!o)return;
    const c=P.pk.reduce((s,k)=>s+(o[k]||0),0);
    if(c===0)return;
    const np=P.autoP(c);
    if(np!==o.p)cnt++;
    o.p=np;
  });
  aL(P.l+'利益目標自動計算: '+cnt+'件更新');rA();
}
function toggleAuto(pl){
  autoFlags[pl]=!autoFlags[pl];
  if(autoFlags[pl])autoCalc(pl); else rA();
}
function delR(i,pl){data[i][pl]=null;if(!data[i].s&&!data[i].m&&!data[i].i&&!data[i].a)data.splice(i,1);rA()}
function addC(p){(p==='s'?sC:mC).push({n:'新規',a:0,mn:''});rA()}
function delC(p,i){(p==='s'?sC:mC).splice(i,1);rA()}

// ============================================================
// ============================================================
// 個人メルカリ CSV (伊藤/網野) - CS2形式 CP932
// 手数料: 売値×10% + 送料1500 + (売値-原価-(売値×10%+1500))×5% (Shopsと同じ)
// ============================================================
function impRival(who,el){
  const f=el.files[0];if(!f)return;
  const rd=new FileReader();rd.onload=ev=>{
    let t;
    const buf=ev.target.result;
    try{t=new TextDecoder('shift-jis').decode(buf)}catch{t=new TextDecoder('utf-8').decode(buf)}
    const r=Papa.parse(t,{header:true,skipEmptyLines:true});
    if(who==='ito')itoCsv=r.data; else aminoCsv=r.data;
    const active=r.data.filter(x=>x['出品状況']==='出品中');
    aL((who==='ito'?'伊藤':'網野')+'メルカリCSV読込: '+r.data.length+'件（出品中'+active.length+'件）');
    rA();
  };rd.readAsArrayBuffer(f);el.value='';
}
function analyzeRival(who){
  const csv=who==='ito'?itoCsv:aminoCsv;if(!csv)return[];
  return csv.map((row,idx)=>{
    const name=row['商品名']||'';
    const price=parseInt(row['価格'])||0;
    const status=row['出品状況']||'';
    const gpu=eG(name);
    const d=gpu?data.find(x=>N(x.n)===N(gpu)):null;
    const o=d&&d.m?d.m:null;
    const np=(o&&o.p)?o.p:null;
    const diff=np!=null&&price?np-price:null;
    return{idx,name,price,status,gpu,np,diff};
  });
}
function rRival(who){
  const pid=who==='ito'?'iv':'av';
  const csv=who==='ito'?itoCsv:aminoCsv;
  const label=who==='ito'?'伊藤':'網野';
  const clr=who==='ito'?'#c084fc':'#fb923c';
  let h=`<div class="sec"><div class="row"><h3 style="color:${clr}">👤 ${label}メルカリ</h3><div style="display:flex;gap:6px;flex-wrap:wrap">
    <label class="btn b2" style="cursor:pointer">📂 CSVインポート<input type="file" accept=".csv" onchange="impRival('${who}',this)"></label>`;
  if(csv){
    h+=`<button class="btn b1" onclick="applyRival('${who}')">⚡ 価格適用</button>`;
    h+=`<button class="btn b2" onclick="expRival('${who}')">📥 CSV出力（出品中のみ）</button>`;
  }
  h+='</div></div>';
  if(!csv){h+=`<div class="empty"><div class="ic">👤</div><p>${label}メルカリのCSVをインポート（CS2形式）</p></div>`}
  else{
    const a=analyzeRival(who);
    const listing=a.filter(r=>r.status==='出品中');
    const sold=a.filter(r=>r.status==='売却済');
    const matched=listing.filter(r=>r.gpu);
    const chg=listing.filter(r=>r.diff!=null&&r.diff!==0);
    h+=`<div style="margin-bottom:6px">
      <span class="stat">全: <b class="W">${a.length}</b></span>
      <span class="stat">出品中: <b style="color:${clr}">${listing.length}</b></span>
      <span class="stat">売却済: <b class="GR">${sold.length}</b></span>
      <span class="stat">GPU検出(出品中): <b class="A">${matched.length}</b></span>
      <span class="stat">変更: <b class="A">${chg.length}</b></span>
    </div>`;
    h+=`<div class="scr"><table><thead><tr>
      <th>#</th><th class="c">出力</th><th class="c">状態</th><th>商品名</th><th>GPU</th>
      <th class="r">現在</th><th class="r">新価格</th><th class="r">差額</th>
      </tr></thead><tbody>`;
    a.forEach((r,i)=>{
      const isOut=r.status==='出品中';
      const dc=r.diff>0?'R':r.diff<0?'G':'GR';
      const stBadge=r.status==='出品中'?'<span class="badge bg">出品中</span>':
        r.status==='売却済'?'<span class="badge bgr">売却済</span>':
        `<span class="badge by">${esc(r.status)}</span>`;
      h+=`<tr${!isOut?' class="xc"':((r.diff&&r.diff!==0)?' style="background:rgba(245,158,11,.04)"':'')}>
        <td class="GR">${i+1}</td>
        <td class="c">${isOut?'<span class="G">○</span>':'<span class="R">✕</span>'}</td>
        <td class="c">${stBadge}</td>
        <td class="trn" title="${esc(r.name)}">${esc(r.name)}</td>
        <td class="m" style="color:${clr}">${r.gpu||'<span class="GR">-</span>'}</td>
        <td class="r m">${r.price?'¥'+r.price.toLocaleString():'-'}</td>
        <td class="r m A">${r.np!=null?'¥'+r.np.toLocaleString():'-'}</td>
        <td class="r m ${dc}" style="font-weight:600">${r.diff!=null&&r.diff!==0?(r.diff>0?'+':'')+r.diff.toLocaleString():'-'}</td>
      </tr>`;
    });
    h+='</tbody></table></div>';
  }
  h+='</div>';
  document.getElementById('p_'+pid).innerHTML=h;
}
function applyRival(who){
  const csv=who==='ito'?itoCsv:aminoCsv;if(!csv)return;
  let up=0,sk=0;
  csv.forEach(row=>{
    if(row['出品状況']!=='出品中')return;
    const name=row['商品名']||'';
    const gpu=eG(name);if(!gpu){sk++;return}
    const d=data.find(x=>N(x.n)===N(gpu));
    const o=d&&d.m?d.m:null;if(!o||!o.p){sk++;return}
    if(String(o.p)!==String(row['価格']))up++;
    row['価格']=String(o.p);
  });
  aL((who==='ito'?'伊藤':'網野')+'メルカリ価格適用: '+up+'件変更 / '+sk+'件スキップ');rA();
}
function expRival(who){
  const csv=who==='ito'?itoCsv:aminoCsv;if(!csv)return;
  const filtered=csv.filter(r=>r['出品状況']==='出品中');
  dl('\uFEFF'+Papa.unparse(filtered),(who==='ito'?'ito':'amino')+'_mercari_updated.csv','text/csv;charset=utf-8');
  aL((who==='ito'?'伊藤':'網野')+'メルカリCSV出力: '+filtered.length+'件');
}

// Log
// ============================================================
function rL(){const el=document.getElementById('p_lg');if(!el)return;
  el.innerHTML=`<div class="sec"><h3 class="GR" style="margin-bottom:6px">操作ログ</h3><div class="logbox">${logs.length?logs.map(l=>'<div>'+esc(l)+'</div>').join(''):'<span class="GR">操作するとログが表示されます</span>'}</div></div>`}

// ============================================================
// Render all
// ============================================================
// ============================================================
// SAVE / LOAD (localStorage)
// ============================================================
const SAVE_KEY='titan_price_tool';
function saveData(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify({data,sC,mC,autoFlags,gpuSync,v:4}));
    const el=document.getElementById('saveInd');if(el){el.style.color='#fbbf24';el.textContent='💾 保存しました';
      setTimeout(()=>{el.style.color='#4ade80';el.textContent='💾 自動保存'},800)}
  }catch(e){}
}
function loadData(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);if(!raw)return false;
    const s=JSON.parse(raw);
    if(s.data)data=s.data;
    if(s.sC)sC=s.sC;
    if(s.mC)mC=s.mC;
    if(s.autoFlags)autoFlags=s.autoFlags;
    if(s.gpuSync!=null)gpuSync=s.gpuSync;
    else if(s.sAuto!=null){autoFlags.s=s.sAuto;autoFlags.m=s.mAuto||false}
    return true;
  }catch(e){return false}
}
function resetData(){
  if(!confirm('保存データを初期値にリセットしますか？'))return;
  localStorage.removeItem(SAVE_KEY);
  location.reload();
}
function expJson(){
  const obj={data,sC,mC,autoFlags,gpuSync,v:4,exported:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='titan_price_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();URL.revokeObjectURL(a.href);
  aL('JSON出力完了');
}
function impJson(el){
  const f=el.files[0];if(!f)return;
  const rd=new FileReader();rd.onload=ev=>{
    try{
      const obj=JSON.parse(ev.target.result);
      if(obj.data)data=obj.data;
      if(obj.sC)sC=obj.sC;
      if(obj.mC)mC=obj.mC;
      if(obj.autoFlags)autoFlags=obj.autoFlags;
      if(obj.gpuSync!=null)gpuSync=obj.gpuSync;
      aL('JSON読込完了: '+data.length+'GPU');
      rA();
    }catch(e){alert('JSONの読込に失敗: '+e.message)}
  };rd.readAsText(f);el.value='';
}

function rA(){rP('s');rP('m');rP('i');rP('a');rC();rV('s');rV('m');rRival('ito');rRival('amino');rL();
  const sw=document.getElementById('syncWrap'),sd=document.getElementById('syncDot');
  if(sw){sw.style.color=gpuSync?'#f472b6':'#52525b'}
  if(sd){sd.style.background=gpuSync?'#f472b6':'#3f3f46'}
  saveData()}

// ============================================================
// Init
// ============================================================
document.getElementById('dateD').textContent=new Date().toLocaleDateString('ja-JP');
const loaded=loadData();
iT();rA();
if(loaded)console.log('TITAN: saved data loaded');
</script>
